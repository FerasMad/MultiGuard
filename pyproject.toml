[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiguard-v4"
version = "0.1.0"
description = "Multimodal fake-news detector (V3.1-spec compliant rebuild)"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }
authors = [
    { name = "Feras Madkhali", email = "iiiferasiii@gmail.com" },
]
keywords = ["fake-news", "multimodal", "deepfake", "forensics", "fusion"]

dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "scikit-learn>=1.4",
    "Pillow>=10.2",
    "opencv-python>=4.9",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=4.45,<5.0",
    "huggingface_hub[cli]>=0.24",
    "accelerate>=0.34",
    "safetensors>=0.4",
]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]
all = [
    "multiguard-v4[gpu,server,dev]",
]

[project.scripts]
v4-train = "v4.cli:train_main"
v4-eval = "v4.cli:eval_main"
v4-build-manifest = "v4.cli:build_manifest_main"
v4-precompute = "v4.cli:precompute_main"
v4-server = "v4.cli:server_main"

[project.urls]
Repository = "https://github.com/FerasMad/MultiGuard"

[tool.setuptools.packages.find]
# After unification (P2.5): V4 source lives in phases/v4/src, forensic in phases/forensic/src
where = ["phases/v4/src", "phases/forensic/src"]
include = ["v4*", "forensic*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "phases/v4/src",
    "phases/forensic/src",
    "phases/v4/tests",
    "phases/forensic/tests",
    "tests",
    "app",
    "scripts",
    "shared",
]
extend-exclude = [
    "data",
    "outputs",
    "cache",
    "build",
    "dist",
    "phases/v1",
    "phases/v2",
    "phases/v3",
    "shared/legacy_utils",
    "phases/v3/.venv-qwen",
    ".venv",
    ".venv-qwen-py312",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PL", "RUF"]
ignore = [
    "E501",       # line too long (we use long lines for clarity)
    "PLR0913",    # too-many-arguments (heavily parameterized training funcs)
    "PLR2004",    # magic-value-comparison (interferes with tests/specs)
    "PLR0915",    # too-many-statements (training scripts are inherently long)
    "PLR0912",    # too-many-branches (CLI scripts have many branches)
    "PLC0415",    # import-outside-top-level (lazy imports in workers per Risk R2)
    "PLW2901",    # redefined-loop-name (intentional in our generators)
    "PLW0603",    # global-statement (registry pattern uses this)
    "PLR0124",    # comparison-with-itself (used for NaN checks)
    "B008",       # do-not-perform-call-in-default-argument
    "SIM108",     # use-ternary (readability preference)
    "SIM105",     # suppressible-exception (try/except with log is intentional)
    "RUF046",     # unnecessary-cast-to-int (int() can be clarifying)
    "RUF059",     # unused-unpacked-variable (Welford tuple unpack)
    "E702",       # multiple-statements-on-one-line (occasional worker style)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "F401"]
"phases/*/tests/*" = ["PLR2004", "F401"]
"__init__.py" = ["F401"]
"scripts/*" = ["PLC0415"]
"phases/forensic/scripts/*" = ["PLC0415"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
# Post-unification: tests live per-phase under phases/<phase>/tests/, plus cross-phase tests at root
testpaths = ["phases/v4/tests", "phases/forensic/tests", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers", "--tb=short", "--import-mode=importlib"]
markers = [
    "slow: marks tests as slow",
    "gpu: marks tests requiring CUDA",
    "spec_compliance: V3.1 spec-section assertions",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning:torch",
]

[tool.coverage.run]
source = ["phases/v4/src/v4", "phases/forensic/src/forensic"]
omit = ["*/tests/*", "*/cli.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
