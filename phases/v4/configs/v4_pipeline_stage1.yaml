# V4 Stage 1 — UnivFD binary forensic pretrain per V3.1 §3.2.
# Output: outputs/v4/stage1_univfd/forensic_model.pth (used to precompute v_imgfor).

seed: 42
deterministic: false
stage: stage1

data:
  type: cached_features
  csv_path: data/processed/univfd_stage1.csv
  cache_root: cache/v4
  feature_keys:
    - { name: v_imgfor_dct, subdir: v_imgfor_dct, dim: null }

fusion:
  # Stage 1 doesn't use a fusion module; trainer adapts to stage=stage1
  type: v3_pairwise
  feat_dim: 768
  fused_dim: 1024
  num_classes: 2
  num_heads: 8
  attn_dropout: 0.1

encoders:
  image:
    type: univfd
    pretrained: data/raw/pretrained/blur_jpg_prob0.pth
    out_dim: 768

train:
  epochs: 30
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-4
  aux_weight: 0.0
  lr_step: 20
  lr_gamma: 0.1
  grad_clip: 1.0
  early_stop_patience: 7
  precision: bf16
  num_workers: 2
  out_dir: outputs/v4/stage1_univfd
