# V4 Stage 2 fusion training -- CORRECTED IMAGE BRANCH (Track B, TB7).
#
# Clone of v4_pipeline_honest_v2.yaml with the image branch regenerated from the
# 8-generator forensic DCT detector (Track B: SD v1.4/v1.5 added from
# shimei123/Genimage with official ImageNet nature; both detectors retrained).
#
# Differences from v4_pipeline_honest_v2.yaml:
#   data.feature_keys[v_imgfor].subdir -> cache/v4/v_imgfor_corrected
#       (regenerated by precompute_v_imgfor_dctforensic.py with the 8-gen ckpt;
#        head Kaiming init is seed-42 deterministic, so ONLY the backbone weights
#        differ vs the original 6-gen cache -> the corrected image features.)
#   encoders.image.ckpt -> phases/forensic/outputs/dct_8gen/forensic_dct_model.pth
#   train.out_dir       -> outputs/v4/stage2_fusion_corrected_seed42
#
# v_semantic (BLIP-2 re-encoded, P15.1a) and v_textfor (Qwen/BLIP-2) are UNCHANGED.
# Multi-seed: run with `--seed {1337,2024} --out-dir outputs/v4/stage2_fusion_corrected_seed{1337,2024}`.

seed: 42
deterministic: false
stage: stage2

data:
  type: cached_features
  csv_path: data/processed/forensic_5class_unified_blip2.csv
  cache_root: .
  feature_keys:
    - { name: v_semantic, subdir: cache/v3/_features/v_semantic_blip2,       dim: 512 }
    # CORRECTED: image features from the 8-generator DCT detector (Track B)
    - { name: v_imgfor,   subdir: cache/v4/v_imgfor_corrected,               dim: 768 }
    - { name: v_textfor,  subdir: cache/v3/_features/v_textfor_qwen_blip2,   dim: 3584 }

encoders:
  semantic:
    type: fnd_clip
    feat_dim: 512
    output_dim: 768
  image:
    type: dct_forensic_v1
    ckpt: phases/forensic/outputs/dct_8gen/forensic_dct_model.pth
    out_dim: 768
  text:
    type: qwen2_7b
    model_name: Qwen/Qwen2-7B-Instruct
    hidden_size: 3584
    layer_index: -1
    output_dim: 768

fusion:
  type: v3_pairwise
  feat_dim: 768
  fused_dim: 1024
  num_classes: 5
  num_heads: 8
  attn_dropout: 0.1
  proj_dims:
    v_semantic: 512
    v_textfor: 3584

train:
  epochs: 50
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-4
  aux_weight: 0.1
  lr_step: 30
  lr_gamma: 0.1
  grad_clip: 1.0
  early_stop_patience: 10
  precision: bf16
  num_workers: 2
  out_dir: outputs/v4/stage2_fusion_corrected_seed42
