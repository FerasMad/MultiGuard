# V4 Stage 2 fusion training -- HONEST PATH v2 (P15.1b).
#
# Single difference from v4_pipeline_honest.yaml:
#   data.feature_keys[v_semantic].subdir -> cache/v3/_features/v_semantic_blip2
#
# The original `cache/v3/_features/v_semantic` was built on 2026-05-18 from
# the ORIGINAL `text` column (LLM-syntactic-fingerprint captions for cls 3/4).
# After P9.3's BLIP-2 caption rewrite, v_textfor was rebuilt from `text_blip2`
# but v_semantic was NOT -- so FND-CLIP's BERT sub-encoder still carried the
# shortcut for class 3/4 rows. P15.1a rebuilt the cls 3/4 portion of v_semantic
# from the BLIP-2 captions; this config retrains Stage 2 against the fresh cache.

seed: 42
deterministic: false
stage: stage2

data:
  type: cached_features
  csv_path: data/processed/forensic_5class_unified_blip2.csv
  cache_root: .
  feature_keys:
    # NEW: v_semantic re-encoded for cls 3/4 from BLIP-2 captions (P15.1a)
    - { name: v_semantic, subdir: cache/v3/_features/v_semantic_blip2,       dim: 512 }
    - { name: v_imgfor,   subdir: cache/v4/v_imgfor_dctforensic,             dim: 768 }
    - { name: v_textfor,  subdir: cache/v3/_features/v_textfor_qwen_blip2,   dim: 3584 }

encoders:
  semantic:
    type: fnd_clip
    feat_dim: 512
    output_dim: 768
  image:
    type: dct_forensic_v1
    ckpt: phases/forensic/outputs/dct/forensic_dct_model.pth
    out_dim: 768
  text:
    type: qwen2_7b
    model_name: Qwen/Qwen2-7B-Instruct
    hidden_size: 3584
    layer_index: -1
    output_dim: 768

fusion:
  type: v3_pairwise
  feat_dim: 768
  fused_dim: 1024
  num_classes: 5
  num_heads: 8
  attn_dropout: 0.1
  proj_dims:
    v_semantic: 512
    v_textfor: 3584

train:
  epochs: 50
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-4
  aux_weight: 0.1
  lr_step: 30
  lr_gamma: 0.1
  grad_clip: 1.0
  early_stop_patience: 10
  precision: bf16
  num_workers: 2
  out_dir: outputs/v4/stage2_fusion_honest_v2_seed42
