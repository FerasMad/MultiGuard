# V4 Stage 2 fusion training using:
#   - NEW v_imgfor cache built from dct_forensic_v1 (Approach 2 forensic encoder)
#   - V3-era cached v_semantic (raw FND-CLIP 512-d) + v_textfor_qwen (raw 3584-d)
#   - V3PairwiseFusion with inline projections (sem_proj 512->768, text_proj 3584->768)
#
# This config lets us retrain V4 Stage 2 on FSOS without rebuilding the v_semantic
# and v_textfor caches (V3 already has them at 16500 samples).
#
# Outputs: outputs/v4/stage2_fusion_dctforensic/

seed: 42
deterministic: false
stage: stage2

data:
  type: cached_features
  # Unified manifest = V3's c4fix with the obsolete "Multimodal-fake-news-detection"
  # absolute paths rewritten to the current "MultiGuard" repo. All 16500 paths resolve.
  csv_path: data/processed/forensic_5class_unified.csv
  cache_root: .
  feature_keys:
    - { name: v_semantic, subdir: cache/v3/_features/v_semantic,        dim: 512 }
    - { name: v_imgfor,   subdir: cache/v4/v_imgfor_dctforensic,        dim: 768 }
    - { name: v_textfor,  subdir: cache/v3/_features/v_textfor_qwen,    dim: 3584 }

# Encoders block kept for provenance + future runtime use; trainer ignores it
# when data.type == cached_features (features come straight from .pt shards).
encoders:
  semantic:
    type: fnd_clip
    feat_dim: 512
    output_dim: 768
  image:
    type: dct_forensic_v1
    ckpt: phases/forensic/outputs/dct/forensic_dct_model.pth
    out_dim: 768
  text:
    type: qwen2_7b
    model_name: Qwen/Qwen2-7B-Instruct
    hidden_size: 3584
    layer_index: -1
    output_dim: 768

fusion:
  type: v3_pairwise
  feat_dim: 768
  fused_dim: 1024
  num_classes: 5
  num_heads: 8
  attn_dropout: 0.1
  # Inline projections for raw V3 caches (P5.10a). Identity for v_imgfor since
  # it's already 768-d post-DctForensicEncoder.
  proj_dims:
    v_semantic: 512
    v_textfor: 3584

train:
  epochs: 50
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-4
  aux_weight: 0.1
  lr_step: 30
  lr_gamma: 0.1
  grad_clip: 1.0
  early_stop_patience: 10
  precision: bf16
  num_workers: 2
  out_dir: outputs/v4/stage2_fusion_dctforensic
