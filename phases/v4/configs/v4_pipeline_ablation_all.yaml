# V4 Stage 2 ablation -- all three branches enabled (baseline for ablation deltas).
#
# Clone of v4_pipeline_honest.yaml with NO disable_branches.
# This is the reference point for the four-way ablation sweep:
#   - fndclip            -> only FND-CLIP (semantic) is active
#   - fndclip_text       -> FND-CLIP + text
#   - fndclip_image      -> FND-CLIP + image
#   - all                -> full pipeline (THIS file)

seed: 42
deterministic: false
stage: stage2

data:
  type: cached_features
  csv_path: data/processed/forensic_5class_unified_blip2.csv
  cache_root: .
  feature_keys:
    - { name: v_semantic, subdir: cache/v3/_features/v_semantic,            dim: 512 }
    - { name: v_imgfor,   subdir: cache/v4/v_imgfor_dctforensic,            dim: 768 }
    - { name: v_textfor,  subdir: cache/v3/_features/v_textfor_qwen_blip2,  dim: 3584 }

encoders:
  semantic:
    type: fnd_clip
    feat_dim: 512
    output_dim: 768
  image:
    type: dct_forensic_v1
    ckpt: phases/forensic/outputs/dct/forensic_dct_model.pth
    out_dim: 768
  text:
    type: qwen2_7b
    model_name: Qwen/Qwen2-7B-Instruct
    hidden_size: 3584
    layer_index: -1
    output_dim: 768

fusion:
  type: v3_pairwise
  feat_dim: 768
  fused_dim: 1024
  num_classes: 5
  num_heads: 8
  attn_dropout: 0.1
  proj_dims:
    v_semantic: 512
    v_textfor: 3584
  # disable_branches: []   # all three branches active

train:
  epochs: 50
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-4
  aux_weight: 0.1
  lr_step: 30
  lr_gamma: 0.1
  grad_clip: 1.0
  early_stop_patience: 10
  precision: bf16
  num_workers: 2
  out_dir: outputs/v4/stage2_ablation_all
