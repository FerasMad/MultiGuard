# Step 2: full pipeline (frozen FND-CLIP + ResNet18 forensic + cross-attention + MLP)
# Implementation Guidelines V2 §10-11

seed: 42

data:
  csv_path: data/processed/forensic_3class.csv
  dct_cache: data/processed/dct_cache
  fnd_cache: data/processed/fnd_features
  max_text_len: 128

# Used only by scripts/precompute_fnd_features.py
models:
  bert: bert-base-uncased
  clip: openai/clip-vit-base-patch32

model:
  # NOTE: `fnd_clip_ckpt` is intentionally null. Loading a task-tuned
  # FND-CLIP checkpoint here leaks labels into v_semantic (see
  # HANDOFF.md, "v1_ooc feature leak"). The cached v_semantic vectors
  # consumed by training are produced by `scripts/precompute_fnd_features.py`,
  # which now defaults to a fresh FND-CLIP (pretrained BERT/ResNet/CLIP
  # only, no task signal). To intentionally reproduce the leaky run for
  # ablation, pass `--ckpt outputs/v1_ooc/best.pt` to that script.
  fnd_clip_ckpt: null
  fnd_feat_dim: 512
  forensic_feat_dim: 512
  fusion_proj_dim: 512
  fusion_heads: 8
  fusion_dropout: 0.1
  forensic_dropout: 0.3

train:
  epochs: 50
  batch_size: 64           # back to 64 — heavy parts are precomputed
  lr: 1.0e-4
  weight_decay: 1.0e-4
  num_workers: 4
  out_dir: outputs/full_pipeline
  lr_step: 30
  lr_gamma: 0.1
  grad_clip: 1.0
  early_stop_patience: 10
  aux_weight: 0.1
