# V4 Stage 2 fusion training — canonical V3.1 §5.5 configuration.
# Trained on cached features (no encoder forwards during training).

seed: 42
deterministic: false
stage: stage2

data:
  type: cached_features
  csv_path: data/processed/forensic_5class_v4.csv
  cache_root: cache/v4
  feature_keys:
    - { name: v_semantic, subdir: v_semantic_fnd, dim: 768 }
    - { name: v_imgfor,   subdir: v_imgfor,      dim: 768 }
    - { name: v_textfor,  subdir: v_textfor_qwen, dim: 3584 }

encoders:
  semantic:
    type: fnd_clip
    ckpt: outputs/v4/stage0_fndclip/best.pt
    feat_dim: 512
    output_dim: 768
  image:
    type: univfd
    ckpt: outputs/v4/stage1_univfd/forensic_model.pth
    out_dim: 768
  text:
    type: qwen2_7b
    model_name: Qwen/Qwen2-7B-Instruct
    hidden_size: 3584
    layer_index: -1
    max_length: 512
    output_dim: 768

fusion:
  type: v3_pairwise
  feat_dim: 768
  fused_dim: 1024
  num_classes: 5
  num_heads: 8
  attn_dropout: 0.1

train:
  epochs: 50
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-4
  aux_weight: 0.1
  lr_step: 30
  lr_gamma: 0.1
  grad_clip: 1.0
  early_stop_patience: 10
  precision: bf16
  num_workers: 2
  out_dir: outputs/v4/stage2_fusion
